<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Dashboard</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="./manifest.webmanifest">

    <script src="./vendor/react-18.3.1.production.min.js"></script>
    <script src="./vendor/react-dom-18.3.1.production.min.js"></script>
    <script src="./vendor/babel-7.23.9.min.js"></script>
    <script src="./vendor/tailwindcss-3.4.17.js"></script>
    <script src="./offline.js"></script>
    <script src="./weather.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        .timeline-container { border-left: 2px solid #e2e8f0; margin-left: 1.5rem; padding-left: 2rem; position: relative; }
        .timeline-dot { width: 28px; height: 28px; border-radius: 50%; background-color: #0ea5e9; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; position: absolute; left: -2rem; transform: translateX(-50%); border: 4px solid #f8fafc; }
        .card-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 20px; flex-shrink: 0; }
        @media (max-width: 640px) {
            .timeline-container { margin-left: 1rem; padding-left: 1.25rem; }
            .timeline-dot { left: -1.25rem; }
        }

        .research-guide { line-height:1.7; overflow-wrap:anywhere; }
        .research-guide h3 {font-size:1.3rem;font-weight:700;line-height:1.35;}
        .research-guide a:focus-visible,.research-guide button:focus-visible {outline:3px solid #0284c7;outline-offset:3px;}
        .daily-guide {max-width:900px;margin:auto;}
        .day-selector {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:16px 0;}
        .day-selector button {min-height:48px;border:1px solid #cbd5e1;border-radius:10px;background:white;padding:8px 4px;font-size:14px;font-weight:600;}
        .day-selector button[aria-pressed=true] {background:#164e63;color:white;border-color:#164e63;}
        .day-plan {background:white;border:1px solid #dbe3e9;border-radius:16px;overflow:hidden;}
        .day-plan figure {margin:0;}
        .day-plan img {width:100%;height:260px;object-fit:cover;}
        .day-plan figcaption {font-size:13px;line-height:1.5;padding:10px 18px;color:#475569;border-bottom:1px solid #e2e8f0;}
        .day-plan figcaption a {text-decoration:underline;}
        .day-body {padding:24px;}
        .day-body p {margin:8px 0 14px;}
        .guide-eyebrow {font-size:14px;color:#475569;font-weight:600;letter-spacing:.04em;}
        .day-facts {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0;}
        .day-facts div {border-top:2px solid #dbeafe;padding-top:8px;}
        .day-facts dt {font-size:14px;color:#475569;}.day-facts dd{font-weight:600;margin-top:4px;}
        .day-stops {list-style:none;padding:0;margin:24px 0;}.day-stops li{display:flex;gap:14px;margin:0 0 18px;}
        .stop-number {display:flex;align-items:center;justify-content:center;background:#e0f2fe;color:#164e63;border-radius:50%;width:30px;height:30px;flex-shrink:0;font-size:14px;font-weight:700;}
        .day-rest {border-left:3px solid #0369a1;padding:10px 16px;background:#f0f9ff;}.day-rest p{margin-bottom:0;}
        .guide-meta {font-size:14px;line-height:1.55;color:#475569;}
        .route-links {display:grid;gap:8px;margin:12px 0;}.route-links a{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:48px;padding:12px 16px;border:1px solid #cbd5e1;border-radius:10px;color:#075985;font-weight:600;}
        .day-detail {border-top:1px solid #cbd5e1;margin-top:16px;}.day-detail summary{padding:16px 0;cursor:pointer;font-weight:600;}.day-detail a{color:#075985;text-decoration:underline;}
        .morning-check {margin-top:20px;padding:24px;border:1px solid #bae6fd;border-radius:16px;background:#f0f9ff;}.morning-check>p{margin:8px 0 16px;}
        .weather-controls {display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:16px 0;}.weather-controls label{display:grid;gap:6px;font-size:14px;flex:1;min-width:160px;}.weather-controls input{min-width:0;width:100%;background:white;border:1px solid #94a3b8;border-radius:8px;min-height:48px;padding:10px;font-size:16px;}
        .guide-primary{background:#164e63;color:white;border-radius:8px;min-height:48px;padding:12px 18px;font-weight:600;}.guide-primary:disabled{opacity:.6;}
        .weather-verdict{background:#ecfdf5;border:1px solid #6ee7b7;padding:16px;border-radius:10px;}.weather-verdict.weather-caution{background:#fffbeb;border-color:#fcd34d;}
        .forecast-place{margin:16px 0;border-top:1px solid #bae6fd;padding-top:16px;}.forecast-place p{margin:6px 0;}.forecast-place a,.guide-links a{color:#075985;text-decoration:underline;}.forecast-place details{white-space:pre-line;}
        .guide-links{display:flex;gap:8px 20px;flex-wrap:wrap;margin:16px 0;}.guide-links a{min-height:44px;display:flex;align-items:center;}
        .guide-contents a {padding:10px 0;min-height:44px;}
        .chapter-photo{margin:16px 0;}.chapter-photo img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;}.chapter-photo figcaption{font-size:14px;color:#475569;margin-top:6px;}
        @media(max-width:640px){
            .research-guide {font-size:16px;line-height:1.75;}
            .day-body,.morning-check {padding:18px;}.day-plan img{height:210px;}
            .day-facts{grid-template-columns:1fr;gap:10px;}.day-facts div{display:grid;grid-template-columns:90px 1fr;gap:12px;}.day-facts dd{margin:0;}
            .weather-controls{display:grid;grid-template-columns:minmax(0,1fr);}.weather-controls label{min-width:0;}
            .guide-table table,.guide-table tbody,.guide-table tr,.guide-table td{display:block;width:100%;min-width:0;}
            .guide-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
            .guide-table tr{margin-bottom:14px;border:1px solid #cbd5e1;border-radius:12px;background:white;overflow:hidden;}
            .guide-table td{padding:10px 14px;font-size:16px;}.guide-table td:first-child{background:#e0f2fe;color:#164e63;font-weight:700;}
            .guide-table td::before{content:attr(data-label);display:block;font-size:14px;font-weight:600;color:#475569;margin-bottom:3px;}
            .guide-table td:first-child::before{font-weight:400;}
            .guide-contents{display:grid;grid-template-columns:1fr;gap:0;}.guide-contents a{border-bottom:1px solid #e2e8f0;text-decoration:none;}
        }

        * {box-sizing:border-box;}
        .stop-card {width:100%;min-width:0;border:1px solid #cbd5e1;border-radius:12px;background:#fff;padding:16px;overflow-wrap:anywhere;}
        .stop-card h4 {font-weight:700;font-size:1.1rem;line-height:1.5;}
        .stop-card .stop-number {display:inline-flex;vertical-align:middle;margin-right:6px;}
        .day-stops li {display:block;margin:0;min-width:0;}
        .stop-metrics,.wildlife-level {font-size:.9rem;}
        .stop-facilities {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;font-size:.9rem;}
        .stop-facilities dt {font-weight:600;color:#475569;}.stop-facilities dd {margin:0;}
        .reset-point {border:2px solid #0284c7;background:#f0f9ff;}
        .day-badge {display:inline-block;font-weight:700;background:#e0f2fe;color:#164e63;padding:4px 10px;border-radius:6px;}
        .wildlife-yellow,.turnaround {background:#fffbeb;border-left:3px solid #d97706;padding:10px;}
        .wildlife-orange {background:#fff7ed;border-left:3px solid #ea580c;padding:10px;}
        .next-leg {padding:12px 16px;color:#475569;font-size:.9rem;}
        .next-reset {border-top:1px solid #cbd5e1;padding-top:10px;font-size:.9rem;}
        @media(max-width:640px){
            #root {overflow-wrap:anywhere;}.day-selector {grid-template-columns:repeat(3,minmax(0,1fr));}
            .day-body {padding:14px;}.stop-facilities {grid-template-columns:1fr;}.stop-facilities>div {display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px;}
            .day-stops {margin:16px 0;}.route-links a {min-width:0;}.day-detail {min-width:0;}
            #root .overflow-x-auto {overflow:visible;}#root table,#root tbody,#root tr,#root td {display:block;width:100%;min-width:0;}
            #root thead {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
            #root td {white-space:normal;text-align:left;}#root tr {border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px;}
        }

        /* Password gate */
        #gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
                background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 1.5rem; }
        #gate .card { background: #ffffff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
                      width: 100%; max-width: 380px; padding: 2rem; text-align: center; }
        #gate h1 { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin: .75rem 0 .1rem; }
        #gate p  { font-size: .85rem; color: #64748b; margin-bottom: 1.25rem; line-height: 1.5; }
        #gate .sub-en { font-size: .78rem; color: #94a3b8; margin: 0 0 .9rem; }
        #gate p .sub-en { display: inline; margin: 0; }
        #gate .lock { font-size: 2.5rem; }
        #gate input { width: 100%; padding: .75rem 1rem; border: 1px solid #cbd5e1; border-radius: 10px;
                      font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s; }
        #gate input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.2); }
        #gate button { width: 100%; margin-top: .75rem; padding: .75rem 1rem; border: none; border-radius: 10px;
                       background: #0f172a; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
                       transition: background .15s, opacity .15s; }
        #gate button:hover { background: #1e293b; }
        #gate button:disabled { opacity: .6; cursor: not-allowed; }
        #gate .err { color: #dc2626; font-size: .85rem; margin-top: .75rem; min-height: 1.1rem; }
    </style>
</head>
<body>
    <!-- Password gate (shown first; the trip data is encrypted until unlocked) -->
    <div id="gate">
        <form class="card" id="gate-form" autocomplete="off">
            <div class="lock">🔒</div>
            <h1>家庭旅行仪表盘</h1>
            <p class="sub-en">Family Trip Dashboard</p>
            <p>请输入密码查看行程与预算<br><span class="sub-en">Enter the password to view the itinerary and budget.</span></p>
            <input id="gate-pw" type="password" placeholder="密码 Password" autofocus autocomplete="current-password" />
            <button id="gate-btn" type="submit" disabled>正在加载… Loading</button>
            <div class="err" id="gate-err"></div>
        </form>
    </div>

    <div id="root" style="display:none"></div>

    <!-- Encrypted trip data is loaded from payload.json before the password gate unlocks. -->

    <script>
        (function () {
            var PAYLOAD = null;
            var SYNC_META = null;
            var UPDATE_PAYLOADS = [];

            function b64ToBytes(b64) {
                var bin = atob(b64), u = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
                return u;
            }

            async function derivePasswordKey(password, salt, iterations) {
                var enc = new TextEncoder();
                var baseKey = await crypto.subtle.importKey(
                    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
                return crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
                    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            }

            async function decryptTrip(password) {
                var plainBuf;
                var privateKey = null;
                if (PAYLOAD.v === 1) {
                    var legacyKey = await derivePasswordKey(password, b64ToBytes(PAYLOAD.salt), PAYLOAD.iter);
                    plainBuf = await crypto.subtle.decrypt(
                        { name: 'AES-GCM', iv: b64ToBytes(PAYLOAD.iv) }, legacyKey, b64ToBytes(PAYLOAD.data));
                } else if (PAYLOAD.v === 2) {
                    var protectedKey = PAYLOAD.privateKey;
                    var passwordKey = await derivePasswordKey(
                        password, b64ToBytes(protectedKey.salt), protectedKey.iter);
                    var privateKeyBytes = await crypto.subtle.decrypt(
                        { name: 'AES-GCM', iv: b64ToBytes(protectedKey.iv) },
                        passwordKey, b64ToBytes(protectedKey.data));
                    privateKey = await crypto.subtle.importKey(
                        'pkcs8', privateKeyBytes, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']);
                    var rawDataKey = await crypto.subtle.decrypt(
                        { name: 'RSA-OAEP' }, privateKey, b64ToBytes(PAYLOAD.wrappedKey));
                    var dataKey = await crypto.subtle.importKey(
                        'raw', rawDataKey, { name: 'AES-GCM' }, false, ['decrypt']);
                    plainBuf = await crypto.subtle.decrypt(
                        { name: 'AES-GCM', iv: b64ToBytes(PAYLOAD.iv) }, dataKey, b64ToBytes(PAYLOAD.data));
                } else {
                    throw new Error('Unsupported encrypted payload');
                }
                var trip = JSON.parse(new TextDecoder().decode(plainBuf));
                if (UPDATE_PAYLOADS.length && !privateKey) throw new Error('TRIP_UPDATE_INVALID');
                for (var updateIndex = 0; updateIndex < UPDATE_PAYLOADS.length; updateIndex++) {
                    var updateEnvelope = UPDATE_PAYLOADS[updateIndex];
                    var updateRawKey = await crypto.subtle.decrypt(
                        { name: 'RSA-OAEP' }, privateKey, b64ToBytes(updateEnvelope.wrappedKey));
                    var updateKey = await crypto.subtle.importKey(
                        'raw', updateRawKey, { name: 'AES-GCM' }, false, ['decrypt']);
                    var updatePlain = await crypto.subtle.decrypt(
                        { name: 'AES-GCM', iv: b64ToBytes(updateEnvelope.iv) },
                        updateKey, b64ToBytes(updateEnvelope.data));
                    applyUpdate(trip, JSON.parse(new TextDecoder().decode(updatePlain)));
                }
                return trip;
            }

            function itemMatches(item, match) {
                return Object.keys(match).every(function (key) {
                    if (key === 'segmentFlight') {
                        var wanted = String(match[key]).replace(/\s/g, '').toUpperCase();
                        return Array.isArray(item.segments) && item.segments.some(function (segment) {
                            return String(segment.flight || '').replace(/\s/g, '').toUpperCase() === wanted;
                        });
                    }
                    if (key === 'titleContains') {
                        return String(item.title || '').toLowerCase().indexOf(String(match[key]).toLowerCase()) !== -1;
                    }
                    return item[key] === match[key];
                });
            }

            function applyUpdate(trip, update) {
                if (!update || update.schemaVersion !== 1 || !Array.isArray(update.operations)) {
                    throw new Error('TRIP_UPDATE_INVALID');
                }
                update.operations.forEach(function (operation) {
                    var locale = trip[operation.locale];
                    var collection = operation.collection === 'yellowstone.sections'
                        ? locale && locale.yellowstone && locale.yellowstone.sections
                        : locale && locale[operation.collection];
                    if (!Array.isArray(collection)) throw new Error('TRIP_UPDATE_INVALID');
                    if (operation.op === 'append' && operation.value) {
                        collection.push(operation.value);
                        return;
                    }
                    if (operation.op !== 'merge' || !operation.match || !operation.set) {
                        throw new Error('TRIP_UPDATE_INVALID');
                    }
                    var matched = false;
                    collection.forEach(function (item) {
                        if (!itemMatches(item, operation.match)) return;
                        Object.assign(item, operation.set);
                        if (operation.segmentSet && operation.match.segmentFlight && Array.isArray(item.segments)) {
                            var wanted = String(operation.match.segmentFlight).replace(/\s/g, '').toUpperCase();
                            item.segments.forEach(function (segment) {
                                if (String(segment.flight || '').replace(/\s/g, '').toUpperCase() === wanted) {
                                    Object.assign(segment, operation.segmentSet);
                                }
                            });
                        }
                        matched = true;
                    });
                    if (!matched) throw new Error('TRIP_UPDATE_INVALID');
                });
            }

            function reveal(data) {
                function go() {
                    if (!window.mountTrip) { setTimeout(go, 30); return; }
                    window.mountTrip(data, SYNC_META);
                    document.getElementById('root').style.display = '';
                    var gate = document.getElementById('gate');
                    if (gate) gate.remove();
                }
                go();
            }

            var form = document.getElementById('gate-form');
            var pw = document.getElementById('gate-pw');
            var btn = document.getElementById('gate-btn');
            var err = document.getElementById('gate-err');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (!PAYLOAD) return;
                err.textContent = '';
                btn.disabled = true;
                btn.textContent = '解锁中… Unlocking';
                try {
                    var data = await decryptTrip(pw.value);
                    pw.value = ''; // Keep decrypted trip data in memory only.
                    reveal(data);
                } catch (e3) {
                    err.textContent = e3 && e3.message === 'TRIP_UPDATE_INVALID'
                        ? '行程更新无法应用，请稍后重试 · A dashboard update could not be applied.'
                        : '密码错误，请重试 · Incorrect password.';
                    btn.disabled = false;
                    btn.textContent = '解锁 Unlock';
                    pw.value = '';
                    pw.focus();
                }
            });

            // Purge legacy plaintext session copies even if the next load fails.
            try {
                for (var i = sessionStorage.length - 1; i >= 0; i--) {
                    var k = sessionStorage.key(i);
                    if (k && k.indexOf('tripData:') === 0) sessionStorage.removeItem(k);
                }
            } catch (e) {}

            async function initialize() {
                var fetchTripData = typeof window !== 'undefined' && window.TripOffline ? window.TripOffline.beginDataSession() : fetch;
                try {
                    var responses = await Promise.all([
                        fetchTripData('./payload.json', { cache: 'no-store' }),
                        fetchTripData('./sync.json', { cache: 'no-store' }),
                        fetchTripData('./updates.json', { cache: 'no-store' })
                    ]);
                    if (!responses[0].ok || !responses[1].ok || !responses[2].ok) throw new Error('Trip data unavailable');
                    PAYLOAD = await responses[0].json();
                    SYNC_META = await responses[1].json();
                    var updateManifest = await responses[2].json();
                    var updateFiles = Array.isArray(updateManifest.updates) ? updateManifest.updates : [];
                    UPDATE_PAYLOADS = await Promise.all(updateFiles.map(async function (filename) {
                        if (!/^[A-Za-z0-9._-]+\.json$/.test(filename)) throw new Error('Invalid update filename');
                        var response = await fetchTripData('./updates/' + filename, { cache: 'no-store' });
                        if (!response.ok) throw new Error('Trip update unavailable');
                        return response.json();
                    }));


                    btn.disabled = false;
                    btn.textContent = '解锁 Unlock';
                } catch (e) {
                    err.textContent = '行程数据暂时无法加载，请刷新重试 · Unable to load trip data.';
                    btn.textContent = '刷新 Refresh';
                    btn.disabled = false;
                    btn.type = 'button';
                    btn.addEventListener('click', function () { location.reload(); });
                }
            }

            (typeof window !== 'undefined' && window.TripOffline ? window.TripOffline.prepareData() : Promise.resolve()).catch(function () {}).then(initialize);
        })();
    </script>

    <script type="text/babel" data-presets="react">
        const { useState, useMemo } = React;

        const Icon = ({ type }) => {
            const icons = { flight: "✈️", lodging: "🏨", car: "🚗", transit: "🚌" };
            const colors = { flight: "bg-blue-100 text-blue-600", lodging: "bg-purple-100 text-purple-600", car: "bg-green-100 text-green-600", transit: "bg-orange-100 text-orange-600" };
            return <div className={`card-icon ${colors[type] || 'bg-gray-100'}`}>{icons[type]}</div>;
        };

        /* ---------- Alerts ---------- */
        const AlertBanner = ({ alerts, header, openWord }) => {
            // Collapsed by default — open it to read the detail.
            const [open, setOpen] = useState(false);
            if (!alerts || !alerts.length) return null;
            const style = {
                urgent: { box: "bg-red-50 border-red-200", dot: "bg-red-500", title: "text-red-900", body: "text-red-800" },
                warn:   { box: "bg-amber-50 border-amber-200", dot: "bg-amber-500", title: "text-amber-900", body: "text-amber-800" },
                info:   { box: "bg-sky-50 border-sky-200", dot: "bg-sky-500", title: "text-sky-900", body: "text-sky-800" },
                done:   { box: "bg-emerald-50 border-emerald-200", dot: "bg-emerald-500", title: "text-emerald-900", body: "text-emerald-700" }
            };
            const openCount = alerts.length;
            return (
                <div className="mb-6">
                    <button onClick={() => setOpen(!open)}
                            className="w-full flex items-center justify-between px-4 py-3 rounded-xl bg-white border border-gray-200 shadow-sm hover:shadow transition-shadow">
                        <span className="flex flex-wrap items-center gap-2 font-semibold text-gray-800 text-sm sm:text-base text-left">
                            <span className="inline-flex items-center justify-center w-6 h-6 rounded-full text-white text-xs font-bold bg-sky-500">
                                {openCount}
                            </span>
                            {header}
                            <span className="text-xs font-medium text-gray-500">({openCount} {openWord})</span>
                        </span>
                        <span className="text-gray-400 text-sm flex-shrink-0">{open ? '▲' : '▼'}</span>
                    </button>
                    {open && (
                        <div className="mt-3 space-y-3">
                            {alerts.map((a, i) => {
                                const s = style[a.level] || style.info;
                                const isDone = a.level === 'done';
                                return (
                                    <div key={i} className={`rounded-xl border p-4 ${s.box}`}>
                                        <div className="flex items-start gap-3">
                                            {isDone
                                                ? <span className="mt-0.5 text-emerald-600 font-bold flex-shrink-0">✓</span>
                                                : <span className={`mt-1.5 w-2 h-2 rounded-full flex-shrink-0 ${s.dot}`}></span>}
                                            <div className="min-w-0">
                                                <h4 className={`font-bold text-sm ${s.title} ${isDone ? 'opacity-80' : ''}`}>{a.title}</h4>
                                                <p className={`text-sm mt-1 leading-relaxed ${s.body}`}>{a.body}</p>
                                                {a.resolution && (
                                                    <p className="text-sm mt-2 leading-relaxed font-medium text-emerald-900 bg-white/70 border border-emerald-200 rounded-lg px-3 py-2">
                                                        {a.resolution}
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------- Flight segments ---------- */
        const Segments = ({ segments }) => (
            <div className="mt-3 space-y-2">
                {segments.map((s, i) => (
                    <div key={i} className="bg-slate-50 rounded-lg border border-slate-200 px-3 py-2">
                        <div className="flex flex-wrap items-baseline gap-x-2 gap-y-1">
                            <span className="text-xs font-bold text-slate-700 bg-white border border-slate-200 rounded px-1.5 py-0.5">{s.flight}</span>
                            <span className="text-sm text-slate-800">
                                <span className="font-semibold">{s.dep}</span> {s.from}
                            </span>
                            <span className="text-slate-400">→</span>
                            <span className="text-sm text-slate-800">
                                <span className="font-semibold">{s.arr}</span> {s.to}
                            </span>
                        </div>
                        {s.note && <p className="text-xs text-slate-500 mt-1">{s.note}</p>}
                    </div>
                ))}
            </div>
        );

        /* ---------- Logistics ---------- */
        const Logistics = ({ rows }) => (
            <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2">
                {rows.map((r, i) => (
                    <div key={i} className="text-sm">
                        <span className="text-gray-500">{r.label}: </span>
                        <span className="text-gray-900 font-medium">{r.value}</span>
                    </div>
                ))}
            </div>
        );

        /* ---------- One itinerary card ---------- */
        const ItemCard = ({ item }) => {
            const needsCheck = item.status === "待确认" || item.status === "Verify";
            return (
                <div className={`p-4 rounded-xl border bg-white shadow-sm transition-shadow hover:shadow-md ${needsCheck ? 'border-amber-300' : 'border-gray-200'}`}>
                    <div className="flex flex-col md:flex-row items-start gap-0 md:gap-4">
                        <div className="flex items-center gap-4 w-full md:w-auto mb-3 md:mb-0">
                            <Icon type={item.type} />
                            <div className="md:hidden flex items-center gap-3">
                                <span className="text-sm font-medium text-gray-500">{item.date}</span>
                                <span className={`text-xs px-2 py-1 rounded-full font-bold ${needsCheck ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}`}>{item.status}</span>
                            </div>
                        </div>

                        <div className="flex-1 w-full min-w-0">
                            <div className="hidden md:flex items-center gap-3 mb-1">
                                <span className="text-sm font-medium text-gray-500">{item.date}</span>
                                <span className={`text-xs px-2 py-1 rounded-full font-bold ${needsCheck ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}`}>{item.status}</span>
                            </div>

                            {/* Title + time on the same line */}
                            <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                                <h3 className="font-bold text-gray-900 text-lg leading-snug">{item.title}</h3>
                                {item.time && (
                                    <span className="text-base font-bold text-sky-700 tabular-nums whitespace-nowrap">
                                        {item.time}
                                    </span>
                                )}
                            </div>

                            <p className="text-gray-600 text-sm mt-1">{item.desc}</p>

                            {item.warn && (
                                <div className="mt-3 rounded-lg bg-amber-50 border border-amber-200 px-3 py-2">
                                    <p className="text-sm text-amber-900"><span className="font-bold">⚠️ </span>{item.warn}</p>
                                </div>
                            )}

                            {item.segments && <Segments segments={item.segments} />}
                            {item.logistics && <Logistics rows={item.logistics} />}

                            {(item.confirmation || item.check_in || item.check_out || item.address) && (
                                <div className="mt-3 flex flex-wrap gap-2">
                                    {item.confirmation && (
                                        <span className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-gray-100 text-gray-800 border border-gray-200">
                                            🎟️ {item.confirmation}
                                        </span>
                                    )}
                                    {item.check_in && (
                                        <span className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100">
                                            🕒 In: {item.check_in}
                                        </span>
                                    )}
                                    {item.check_out && (
                                        <span className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100">
                                            🕒 Out: {item.check_out}
                                        </span>
                                    )}
                                    {item.address && (
                                        <a href={`https://maps.google.com/?q=${encodeURIComponent(item.address)}`}
                                           target="_blank" rel="noopener noreferrer"
                                           className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-purple-50 text-purple-700 border border-purple-100 hover:bg-purple-100 transition-colors">
                                            📍 {item.address}
                                        </a>
                                    )}
                                </div>
                            )}

                            {item.links && item.links.length > 0 && (
                                <div className="mt-3 flex flex-wrap gap-2">
                                    {item.links.map((l, i) => (
                                        <a key={i} href={l.url} target="_blank" rel="noopener noreferrer"
                                           className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-900 text-white hover:bg-gray-700 transition-colors">
                                            {l.label} ↗
                                        </a>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const WeatherCheck = ({ day, zh }) => {
            const pick=(en,cn)=>zh?cn:en;
            const [date,setDate]=React.useState(day.date);
            const [result,setResult]=React.useState(null);
            const [online,setOnline]=React.useState(navigator.onLine);
            React.useEffect(()=>{const update=()=>setOnline(navigator.onLine);window.addEventListener('online',update);window.addEventListener('offline',update);return()=>{window.removeEventListener('online',update);window.removeEventListener('offline',update);};},[]);
            const [busy,setBusy]=React.useState(false);
            const token=React.useRef(0);
            React.useEffect(()=>{token.current++;setDate(day.date);setResult(null);setBusy(false);},[day.date]);
            const check=async()=>{
                const request=++token.current;setBusy(true);setResult(null);
                const results=await Promise.allSettled(day.weatherPoints.map(p=>TripWeather.loadPoint(p,date)));
                if(request!==token.current)return;
                setResult({results,checked:new Date().toISOString()});setBusy(false);
            };
            const values=result?.results.filter(r=>r.status==='fulfilled').map(r=>r.value)||[];
            const incomplete=!online || values.length!==day.weatherPoints.length || values.some(v=>!v.summary.available||v.summary.stale||v.summary.rain===null||v.summary.wind===null||v.alerts===null);
            const caution=values.some(v=>v.summary.caution||v.alerts?.some(a=>['Extreme','Severe','Moderate'].includes(a.severity)));
            const wet=values.some(v=>v.summary.wet);
            const temp=v=>v===null?'—':`${Math.round(v)}°F / ${Math.round((v-32)*5/9)}°C`;
            const time=v=>new Date(v).toLocaleString(zh?'zh-CN':'en-US',{timeZone:'America/Denver',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
            return <section className="morning-check" aria-label={pick('Morning weather check','早晨天气检查')}>
                <h3>{pick('Before you set off','出发前看一眼')}</h3>
                <p role="status">{online?pick('Internet required. Results are a dated snapshot, not continuous live monitoring.','需联网。结果为标注时间的快照，并非持续实时监控。'):pick('Offline: weather, alerts, roads and eruption predictions cannot be refreshed. Any displayed results may be stale.','离线：天气、警报、道路和喷发预测无法刷新。已显示结果可能过时。')}</p>
                <p>{pick('Check the forecast for this route, then check road access. All times are Yellowstone time (MDT).','先查这条路线的预报，再确认道路通行。时间均为黄石当地 MDT。')}</p>
                <div className="weather-controls"><label>{pick('Forecast date','预报日期')}<input type="date" value={date} onChange={e=>{token.current++;setDate(e.target.value);setResult(null);setBusy(false);}} /></label>
                <button className="guide-primary" disabled={busy||!date||!online} onClick={check}>{busy?pick('Checking…','正在检查…'):pick('Check weather now','立即查天气')}</button></div>
                <div aria-live="polite">{result && <>
                    <div className={'weather-verdict '+(incomplete||caution?'weather-caution':'')}><strong>{incomplete?pick('Check incomplete — confirm manually','检查不完整，请手动确认'):caution?pick('Reconsider outdoor stops','重新评估户外安排'):wet?pick('Keep the day flexible','今天灵活安排'):pick('Forecast supports this route','预报支持这条路线')}</strong>
                    <p>{incomplete?pick('Missing or older forecast data cannot confirm the plan. Open the official forecasts below.','缺失或较旧的预报不能确认行程，请打开下方官方预报。'):caution?day.caution:wet?day.wet:day.fair}</p></div>
                    <p className="guide-meta">{pick('Checked','查询时间')} {time(result.checked)} MDT · {pick('Forecast guidance, not a road or trail clearance.','这是预报建议，并不代表道路或步道已确认开放。')}</p>
                    {result.results.map((r,i)=>{const point=day.weatherPoints[i], v=r.status==='fulfilled'?r.value:null;return <div className="forecast-place" key={point.name}>
                        <strong>{point.name}</strong>{v&&v.summary.available?<>
                            <p>{temp(v.summary.low)} → {temp(v.summary.high)} · {pick('8 am–6 pm available hours','8–18点可用时段')}</p>
                            <p>{v.summary.conditions.join(' / ')}</p><p>{pick('Max rain chance','最高降水概率')} {v.summary.rain===null?pick('unavailable','暂无'):v.summary.rain+'%'} · {pick('Wind up to','风速最高')} {v.summary.wind===null?'—':v.summary.wind+' mph'}</p>
                            <p className="guide-meta">{pick('NWS issued','NWS发布')} {v.summary.issued?time(v.summary.issued):pick('unknown','未知')} MDT {v.summary.stale?pick('· older than 12 hours / unavailable time','· 超过12小时／时间缺失'):''}</p>
                            {day.stars && v.night.available && <p>{pick('9–11 pm stars','21–23点观星')}：{temp(v.night.low)} · {v.night.conditions.join(' / ')}. {pick('Moon, smoke and the southern horizon still matter; use the star guide.','仍需考虑月光、烟霾及南方地平线，请查看银河指南。')}</p>}
                        </>:<p>{pick('Forecast for this date is unavailable. Try again or use the official link.','此日期暂无预报，请重试或打开官方链接。')}</p>}
                        {v?.alerts===null?<p>{pick('Weather alerts could not be checked.','天气警报未能读取。')}</p>:v?.alerts?.map((a,j)=><details key={j}><summary>{a.event}</summary><p>{a.headline}</p><p>{a.instruction||a.description}</p></details>)}
                        <a href={`https://forecast.weather.gov/MapClick.php?lat=${point.lat}&lon=${point.lon}`} target="_blank" rel="noopener noreferrer">{pick('Official forecast & alerts ↗','官方预报与警报 ↗')}</a>
                    </div>;})}
                </>}</div>
                <div className="guide-links"><a href="https://www.nps.gov/yell/planyourvisit/geyser-activity.htm" target="_blank" rel="noopener noreferrer">{pick('Geyser predictions ↗','喷发预测 ↗')}</a><a href="https://www.nps.gov/yell/planyourvisit/parkroads.htm" target="_blank" rel="noopener noreferrer">{pick('Park roads ↗','公园道路 ↗')}</a><a href="https://www.511mt.net/" target="_blank" rel="noopener noreferrer">{pick('Montana roads ↗','蒙大拿道路 ↗')}</a><a href="https://fire.airnow.gov/" target="_blank" rel="noopener noreferrer">{pick('Smoke map ↗','烟霾地图 ↗')}</a></div>
                <p className="guide-meta">{pick('The check suggests changes; it does not automatically rewrite your itinerary. If changing days, choose a route above and set the forecast date to the day you will actually go.','此检查提供调整建议，不会自动改写行程。调换游览日时，请在上方选路线，并把预报日期改为实际出行日。')}</p>
            </section>;
        };
        const DailyGuide = ({ report }) => {
            const zh=report.dailyGuide.locale==='zh', pick=(en,cn)=>zh?cn:en, days=report.dailyGuide.days;
            const [selected,setSelected]=React.useState(()=>Math.max(0,days.findIndex(d=>d.date===TripWeather.dateAt(Date.now()))));
            const day=days[selected];
            return <section className="daily-guide">
                <h2 className="text-xl font-bold">{pick('Your day, at a glance','今天怎么玩')}</h2>
                <div className="day-selector" role="group" aria-label={pick('Choose a day','选择日期')}>{days.map((d,i)=><button key={d.date} aria-pressed={selected===i} onClick={()=>setSelected(i)}>{d.shortLabel}</button>)}</div>
                <p className="guide-meta">{pick('Static itinerary guidance · driving ranges exclude parking, wildlife and construction delays.','静态行程建议 · 车程区间不含停车、动物及施工延误。')}</p>
                <article className="day-plan mt-5">
                    {day.photo && <figure><img src={day.photo.url} alt={day.photo.alt} loading="lazy" referrerPolicy="no-referrer" onError={e=>{e.currentTarget.hidden=true;}} /><figcaption>{day.photo.caption} · <a href={day.photo.sourceUrl} target="_blank" rel="noopener noreferrer">{day.photo.credit}</a> · {pick('Reference photo, not current conditions','参考照片，非实时景象')}</figcaption></figure>}
                    <div className="day-body"><p className="guide-eyebrow">{day.date} · MDT</p><h3>{day.title}</h3>{day.badge && <p className="day-badge">{day.badge}</p>}<p>{day.intro}</p>
                        <dl className="day-facts">{day.facts.map(([label,value])=><div key={label}><dt>{label}</dt><dd>{value}</dd></div>)}</dl>
                        <ol className="day-stops">{day.stops.map((stop,i)=><li key={i}>
                            <article className={'stop-card '+(stop.reset?'reset-point':'')}>
                                {stop.reset && <p className="day-badge">{pick('RESET POINT','补给休整点')}</p>}
                                <h4><span className="stop-number">{i+1}</span> {stop.time && <span>{stop.time} · </span>}{stop.title}</h4>
                                {(stop.drive||stop.duration) && <p className="stop-metrics">🚗 {stop.drive} · ⏱ {stop.duration}</p>}
                                {stop.parking && <dl className="stop-facilities">{[[pick('Parking','停车'),stop.parking],[pick('Restrooms','洗手间'),stop.restroom],[pick('Food','餐饮'),stop.food],[pick('Gas','加油'),stop.gas]].map(([label,value])=><div key={label}><dt>{label}</dt><dd>{value}</dd></div>)}</dl>}
                                {stop.awareness && <p className={'wildlife-level wildlife-'+stop.awareness}>{stop.awareness==='green'?pick('🟢 Wildlife: normal awareness','🟢 野生动物：常规留意'):stop.awareness==='yellow'?pick('🟡 Wildlife: real trail; stay together, spray accessible','🟡 野生动物：真实步道；结伴，熊喷雾随手可取'):pick('🟠 Wildlife zone: watch from vehicle / legal pullouts; never approach','🟠 动物活动区：车内／合法停车点观察，不靠近')}</p>}
                                <p>{stop.text}</p>
                                {stop.priority && <p><strong>{pick('Priority','优先级')}: </strong>{stop.priority}</p>}
                                {stop.decision && <p><strong>{pick('Safe to skip?','可跳过？')} </strong>{stop.decision}</p>}
                                {stop.fallback && <p><strong>{pick('Parking fallback','停车备选')}: </strong>{stop.fallback}</p>}
                                {stop.next && <p className="next-reset"><strong>{pick('Next reliable facilities','下一可靠补给点')}: </strong>{stop.next}</p>}
                                {stop.turnaround && <div className="turnaround"><strong>{pick('Optional extension / turnaround','可选延伸／折返点')}</strong><p>{stop.turnaround}</p></div>}
                            </article>
                            {i<day.stops.length-1 && <div className="next-leg">↓ {day.stops[i+1].drive} {pick('drive','车程')}<br/>{pick('NEXT','下一站')} → {day.stops[i+1].title}</div>}
                        </li>)}</ol>
                        <div className="day-rest"><strong>{pick('Keep it comfortable','轻松原则')}</strong><p>{day.comfort}</p></div>
                        {day.routes.length>0 && <h4 className="font-semibold mt-5">{pick('Directions, one leg at a time','分段导航')}</h4>}<p className="guide-meta">{pick('Use downloaded Google Maps or Apple Maps for the next driving leg. Check signs and road closures; estimates exclude sightseeing and wildlife delays.','下一段驾车请用已下载的Google或Apple离线地图。以路标和道路封闭信息为准；估计不含游览与动物堵车。')}</p>
                        <div className="route-links">{day.routes.map((route,i)=><a key={i} href={route.url} target="_blank" rel="noopener noreferrer"><span>{i+1}. {route.label}</span><span aria-hidden="true">↗</span></a>)}</div>
                        <p className="guide-meta">{day.routeNote}</p>
                        {day.details.map(detail=>{const chapter=report.chapters.find(c=>c.id===detail.id);return chapter?<details className="day-detail" key={detail.id}><summary>{detail.label}</summary>{!detail.blocks&&chapter.paragraphs?.map((p,i)=><p key={i}>{p.text}</p>)}{chapter.blocks?.filter((b,i)=>!detail.blocks||detail.blocks.includes(i)).map((b,i)=><div key={i}><h4 className="font-semibold mt-4">{b.heading}</h4>{b.paragraphs?.map((p,j)=><p key={j}>{p.text}</p>)}</div>)}<a href={`#guide-${detail.id}`}>{pick('Full detail & sources ↓','完整说明与来源 ↓')}</a></details>:null;})}
                    </div>
                </article>
                {report.dailyGuide.safety && <details className="day-detail"><summary>{pick('Wildlife distances & trail essentials','动物距离与步道须知')}</summary><p>{report.dailyGuide.safety}</p></details>}
                {report.dailyGuide.navigation && <p className="guide-meta">{report.dailyGuide.navigation}</p>}
                <details className="day-detail"><summary>{pick('Live weather, roads & geyser predictions · Internet required','实时天气、道路与喷发预测 · 需联网')}</summary><WeatherCheck key={day.date} day={day} zh={zh} /></details>
            </section>;
        };

        /* ---------- Private research guide ---------- */
        const ResearchGuide = ({ report }) => {
            const cite = (ids = []) => ids.map(id => {
                const source = report.sources.find(s => s.id === id);
                return source ? <a key={id} href={source.url || `#source-${id}`} target={source.url ? '_blank' : undefined} rel="noopener noreferrer" className="text-sky-800 underline ml-1">[{id}]</a> : null;
            });
            return <article className="research-guide space-y-6 text-gray-800">
                {report.dailyGuide && <DailyGuide report={report} />}
                <header className="border-b pb-5">
                    <h2 className="text-2xl font-bold">{report.heading}</h2>
                    <p className="mt-3 leading-relaxed">{report.summary}</p>
                    <p className="mt-3 text-sm text-gray-600">{report.status}</p>
                </header>
                <nav aria-label={report.navigationLabel} className="guide-contents flex flex-wrap gap-x-4 gap-y-2 text-sm border-b pb-4">
                    {report.chapters.map(c => <a key={c.id} href={`#guide-${c.id}`} className="underline text-sky-800">{c.heading}</a>)}
                </nav>
                {report.chapters.map(c => <section id={`guide-${c.id}`} key={c.id} className="scroll-mt-4 border-b pb-6">
                    <h3 className="text-xl font-semibold mb-3">{c.heading}</h3>
                    {c.photo && <figure className="chapter-photo"><img src={c.photo.url} alt={c.photo.alt} loading="lazy" referrerPolicy="no-referrer" /><figcaption>{c.photo.caption} · <a href={c.photo.sourceUrl} target="_blank" rel="noopener noreferrer">{c.photo.credit}</a></figcaption></figure>}
                    {(c.paragraphs || []).map((p, i) => <p key={i} className="leading-relaxed mb-3">{p.text}{cite(p.refs)}</p>)}
                    {c.table && <div className="guide-table mb-4"><table className="w-full text-left border-collapse">
                        <thead className="bg-gray-100"><tr>{c.table.cols.map((v,i) => <th scope="col" key={i} className="p-3 border-b">{v}</th>)}</tr></thead>
                        <tbody>{c.table.rows.map((row,i) => <tr key={i} className="border-b even:bg-gray-50">{row.map((v,j) => <td key={j} data-label={c.table.cols[j]} className="p-3 align-top leading-relaxed">{v}</td>)}</tr>)}</tbody>
                    </table><p className="text-sm mt-2">{c.table.note}{cite(c.table.refs)}</p></div>}
                    {(c.blocks || []).map((b,i) => <div key={i} className="mt-4">
                        <h4 className="font-semibold mb-2">{b.heading}</h4>
                        {(b.paragraphs || []).map((p,j) => <p key={j} className="leading-relaxed mb-3">{p.text}{cite(p.refs)}</p>)}
                        {b.items && <ul className="list-disc pl-5 space-y-2">{b.items.map((p,j) => <li key={j} className="leading-relaxed">{p.text}{cite(p.refs)}</li>)}</ul>}
                    </div>)}
                </section>)}
                <section id="guide-sources"><h3 className="text-xl font-semibold mb-3">{report.sourcesLabel}</h3>
                    <ol className="space-y-3 text-sm">{report.sources.map(s => <li id={`source-${s.id}`} key={s.id} className="break-words">[{s.id}] {s.publisher}. {s.url ? <a href={s.url} target="_blank" rel="noopener noreferrer" className="underline text-sky-800">{s.title}</a> : s.title}. {s.date}</li>)}</ol>
                </section>
            </article>;
        };
        const Yellowstone = ({ y }) => {
            const report = y.sections.filter(s => s.type === 'research').slice(-1)[0];
            if (!report) return <LegacyYellowstone y={y} />;
            return <div className="space-y-8"><ResearchGuide report={report} />
                {!report.dailyGuide?.finalized && <details className="border-t pt-4 text-gray-600"><summary className="cursor-pointer">{report.archiveLabel}</summary>
                    <div className="mt-4"><LegacyYellowstone y={{ ...y, sections: y.sections.filter(s => s.type !== 'research') }} /></div>
                </details>}</div>;
        };
        /* ---------- Yellowstone page ---------- */
        const LegacyYellowstone = ({ y }) => (
            <div className="space-y-6">
                <div>
                    <h2 className="text-2xl font-bold text-gray-900">{y.title}</h2>
                    <p className="text-gray-600 mt-1">{y.subtitle}</p>
                </div>

                {y.notice && (
                    <div className="rounded-xl border border-amber-200 bg-amber-50 p-4">
                        <h3 className="font-bold text-amber-900 text-sm">⚠️ {y.notice.title}</h3>
                        <ul className="mt-2 space-y-1.5">
                            {y.notice.items.map((it, i) => (
                                <li key={i} className="text-sm text-amber-800 flex gap-2">
                                    <span className="text-amber-500 flex-shrink-0">•</span><span>{it}</span>
                                </li>
                            ))}
                        </ul>
                    </div>
                )}

                {y.sections.map((sec, si) => (
                    <div key={si}>
                        <h3 className="text-lg font-bold text-gray-800 mb-3">{sec.heading}</h3>

                        {sec.type === 'days' && (
                            <div className="space-y-3">
                                {sec.days.map((d, i) => (
                                    <div key={i} className="rounded-xl border border-gray-200 bg-white shadow-sm p-4">
                                        <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-2">
                                            <span className="inline-flex items-center justify-center px-2.5 py-1 rounded-lg bg-sky-500 text-white text-xs font-bold">{d.day}</span>
                                            <span className="font-bold text-gray-900">{d.date}</span>
                                            <span className="text-gray-500 text-sm">{d.theme}</span>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                                            <div className="bg-slate-50 rounded-lg p-3 border border-slate-200">
                                                <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">AM</div>
                                                <p className="text-sm text-slate-800">{d.morning}</p>
                                            </div>
                                            <div className="bg-slate-50 rounded-lg p-3 border border-slate-200">
                                                <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">PM</div>
                                                <p className="text-sm text-slate-800">{d.afternoon}</p>
                                            </div>
                                        </div>
                                        {d.highlight && (
                                            <p className="text-sm text-gray-700 mt-3">
                                                <span className="font-semibold">👀 </span>{d.highlight}
                                            </p>
                                        )}
                                        {d.note && (
                                            <p className="text-xs text-amber-800 mt-2 bg-amber-50 border border-amber-200 rounded px-2 py-1.5">⚠️ {d.note}</p>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        {sec.type === 'table' && (
                            <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[520px]">
                                    <thead className="bg-gray-50">
                                        <tr>{sec.cols.map((c, i) => (
                                            <th key={i} className="p-3 border-b font-semibold text-gray-600 text-sm">{c}</th>
                                        ))}</tr>
                                    </thead>
                                    <tbody>
                                        {sec.rows.map((r, i) => (
                                            <tr key={i} className="border-b last:border-0 hover:bg-gray-50 transition-colors">
                                                {r.map((cell, j) => (
                                                    <td key={j} className={`p-3 text-sm ${j === 1 ? 'font-semibold text-gray-900' : 'text-gray-700'}`}>{cell}</td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {sec.type === 'list' && (
                            <div className="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
                                <ul className="space-y-2">
                                    {sec.items.map((it, i) => (
                                        <li key={i} className="text-sm text-gray-800 flex gap-2">
                                            <span className="text-sky-500 font-bold flex-shrink-0">{i + 1}.</span><span>{it}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}

                        {sec.note && <p className="text-sm text-gray-500 mt-2 italic">{sec.note}</p>}
                    </div>
                ))}
            </div>
        );

        /* ---------- Corrections page ---------- */
        const Changes = ({ c }) => (
            <div className="space-y-4">
                <p className="text-gray-700">{c.intro}</p>
                <div className="space-y-3">
                    {c.rows.map((r, i) => (
                        <div key={i} className="rounded-xl border border-gray-200 bg-white shadow-sm p-4">
                            <h4 className="font-bold text-gray-900 text-sm mb-3">{r.item}</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div className="rounded-lg bg-red-50 border border-red-200 p-3">
                                    <div className="text-xs font-bold text-red-500 uppercase tracking-wide mb-1">Was</div>
                                    <p className="text-sm text-red-900 line-through decoration-red-300">{r.was}</p>
                                </div>
                                <div className="rounded-lg bg-green-50 border border-green-200 p-3">
                                    <div className="text-xs font-bold text-green-600 uppercase tracking-wide mb-1">Now</div>
                                    <p className="text-sm text-green-900 font-medium">{r.now}</p>
                                </div>
                            </div>
                            <p className="text-xs text-gray-500 mt-3"><span className="font-semibold">Source: </span>{r.why}</p>
                        </div>
                    ))}
                </div>
            </div>
        );

        /* ---------- Main ---------- */
        const Dashboard = ({ tripData, syncMeta }) => {
            // Chinese by default so the page is readable to Bo's parents on open.
            const [lang, setLang] = useState('zh');
            const [tab, setTab] = useState('timeline');
            const t = tripData[lang];

            const totalUSD = useMemo(() => {
                return t.budget.reduce((acc, curr) => {
                    const numStr = curr.cost.replace(/[^\d.-]/g, '');
                    if (!numStr) return acc;
                    let val = parseFloat(numStr);
                    if (curr.cost.includes('CNY')) { val = val / 7.1; }
                    return acc + val;
                }, 0);
            }, [t.budget]);

            const formattedTotal = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(totalUSD);

            const latestGuide = t.yellowstone.sections.filter(s => s.type === 'research').slice(-1)[0];
            const TABS = [
                ['timeline', t.tabs.timeline],
                ['budget', t.tabs.budget],
                ['yellowstone', t.tabs.yellowstone],
                ['changes', t.tabs.changes]
            ];

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-2 border-b pb-4">
                        <h1 className="text-xl sm:text-2xl font-bold text-gray-800">{t.title}</h1>
                        <div className="bg-gray-200 p-1 rounded-lg flex text-sm font-medium self-start sm:self-auto">
                            <button onClick={() => setLang('zh')} className={`px-3 py-1 rounded-md transition-colors ${lang === 'zh' ? 'bg-white shadow' : 'text-gray-500 hover:text-gray-700'}`}>中文</button>
                            <button onClick={() => setLang('en')} className={`px-3 py-1 rounded-md transition-colors ${lang === 'en' ? 'bg-white shadow' : 'text-gray-500 hover:text-gray-700'}`}>English</button>
                        </div>
                    </div>
                    <div className="flex flex-wrap gap-x-3 gap-y-1 text-xs text-gray-400 mb-6">
                        <span>{t.verifiedLabel}</span>
                        {syncMeta?.lastSynced && (
                            <span title={syncMeta.source || ''}>
                                {lang === 'zh' ? '最近同步' : 'Last synced'}: {new Intl.DateTimeFormat(lang === 'zh' ? 'zh-CN' : 'en-US', {
                                    dateStyle: 'medium', timeStyle: 'short', timeZone: syncMeta.timeZone || 'America/Los_Angeles'
                                }).format(new Date(syncMeta.lastSynced))}
                            </span>
                        )}
                    </div>

                    {latestGuide && <div className="border border-sky-200 bg-sky-50 p-4 mb-5">
                        <p className="text-sm leading-relaxed">{latestGuide.banner}</p>
                        <button onClick={() => setTab('yellowstone')} className="mt-2 font-semibold underline text-sky-900">{latestGuide.openLabel}</button>
                    </div>}
                    <AlertBanner alerts={t.alerts} header={t.alertsHeader} openWord={t.urgentLabel} settledWord={t.settledWord} />

                    <div className="flex flex-wrap gap-2 mb-6">
                        {TABS.map(([key, label]) => (
                            <button key={key} onClick={() => setTab(key)}
                                    className={`px-4 py-2 rounded-lg font-semibold text-sm transition-colors ${tab === key ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                                {label}
                            </button>
                        ))}
                    </div>

                    {tab === 'timeline' && (
                        <div>
                            {latestGuide?.dailyGuide?.finalized && <DailyGuide report={latestGuide} />}
                            <details open={!latestGuide?.dailyGuide?.finalized} className="day-detail"><summary>{lang==='zh'?'预订及原时间线（旧游览安排以最新指南为准）':'Bookings & original timeline (older sightseeing plans superseded by the guide)'}</summary>
                            <div className="timeline-container mt-8 relative">
                            {t.phases.map((phase) => (
                                <div key={phase.id} className="mb-10 relative">
                                    <div className="timeline-dot">{phase.id}</div>
                                    <h2 className="text-lg sm:text-xl font-bold text-gray-800 mb-4">{phase.title}</h2>
                                    <div className="space-y-4">
                                        {phase.items.map((item, idx) => <ItemCard key={idx} item={item} />)}
                                    </div>
                                </div>
                            ))}
                            </div></details>
                        </div>
                    )}

                    {tab === 'budget' && (
                        <div className="space-y-6">
                            <div className="bg-gradient-to-r from-gray-800 to-gray-700 rounded-xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center text-white">
                                <div>
                                    <h3 className="text-lg font-medium text-gray-200">{lang === 'zh' ? '预估总花费' : 'Estimated Total Cost'}</h3>
                                    <p className="text-sm text-gray-400 mt-1">{lang === 'zh' ? '* 含 CNY 换算（约 1 USD ≈ 7.1 CNY）' : '* Includes CNY conversion (approx. 1 USD ≈ 7.1 CNY)'}</p>
                                </div>
                                <div className="text-4xl font-bold mt-4 md:mt-0 tracking-tight text-white tabular-nums">
                                    {formattedTotal}
                                </div>
                            </div>

                            <div className="bg-white rounded-xl border shadow-sm overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[640px]">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="p-4 border-b font-semibold text-gray-600 text-sm">{lang === 'zh' ? '分类' : 'Category'}</th>
                                            <th className="p-4 border-b font-semibold text-gray-600 text-sm">{lang === 'zh' ? '项目' : 'Item'}</th>
                                            <th className="p-4 border-b font-semibold text-gray-600 text-sm text-right">{lang === 'zh' ? '金额' : 'Cost'}</th>
                                            <th className="p-4 border-b font-semibold text-gray-600 text-sm">{lang === 'zh' ? '政策与状态' : 'Policy & Status'}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {t.budget.map((b, idx) => (
                                            <tr key={idx} className="border-b last:border-0 hover:bg-gray-50 transition-colors">
                                                <td className="p-4 text-sm font-medium">{b.cat}</td>
                                                <td className="p-4 text-sm text-gray-700">{b.item}</td>
                                                <td className="p-4 text-sm font-bold text-gray-900 whitespace-nowrap text-right tabular-nums">{b.cost}</td>
                                                <td className="p-4 text-sm text-gray-600">{b.policy}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {tab === 'yellowstone' && <Yellowstone y={t.yellowstone} />}
                    {tab === 'changes' && <Changes c={t.changes} />}
                </div>
            );
        };

        window.mountTrip = (tripData, syncMeta) => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<Dashboard tripData={tripData} syncMeta={syncMeta} />);
        };
    </script>
</body>
</html>
