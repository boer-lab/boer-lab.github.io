<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Dashboard</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        .timeline-container { border-left: 2px solid #e2e8f0; margin-left: 1.5rem; padding-left: 2rem; position: relative; }
        .timeline-dot { width: 28px; height: 28px; border-radius: 50%; background-color: #0ea5e9; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; position: absolute; left: -2rem; transform: translateX(-50%); border: 4px solid #f8fafc; }
        .card-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 20px; flex-shrink: 0; }
        @media (max-width: 640px) {
            .timeline-container { margin-left: 1rem; padding-left: 1.25rem; }
            .timeline-dot { left: -1.25rem; }
        }

        /* Password gate */
        #gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
                background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 1.5rem; }
        #gate .card { background: #ffffff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
                      width: 100%; max-width: 380px; padding: 2rem; text-align: center; }
        #gate h1 { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin: .75rem 0 .1rem; }
        #gate p  { font-size: .85rem; color: #64748b; margin-bottom: 1.25rem; line-height: 1.5; }
        #gate .sub-en { font-size: .78rem; color: #94a3b8; margin: 0 0 .9rem; }
        #gate p .sub-en { display: inline; margin: 0; }
        #gate .lock { font-size: 2.5rem; }
        #gate input { width: 100%; padding: .75rem 1rem; border: 1px solid #cbd5e1; border-radius: 10px;
                      font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s; }
        #gate input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.2); }
        #gate button { width: 100%; margin-top: .75rem; padding: .75rem 1rem; border: none; border-radius: 10px;
                       background: #0f172a; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
                       transition: background .15s, opacity .15s; }
        #gate button:hover { background: #1e293b; }
        #gate button:disabled { opacity: .6; cursor: not-allowed; }
        #gate .err { color: #dc2626; font-size: .85rem; margin-top: .75rem; min-height: 1.1rem; }
    </style>
</head>
<body>
    <!-- Password gate (shown first; the trip data is encrypted until unlocked) -->
    <div id="gate">
        <form class="card" id="gate-form" autocomplete="off">
            <div class="lock">🔒</div>
            <h1>家庭旅行仪表盘</h1>
            <p class="sub-en">Family Trip Dashboard</p>
            <p>请输入密码查看行程与预算<br><span class="sub-en">Enter the password to view the itinerary and budget.</span></p>
            <input id="gate-pw" type="password" placeholder="密码 Password" autofocus autocomplete="current-password" />
            <button id="gate-btn" type="submit" disabled>正在加载… Loading</button>
            <div class="err" id="gate-err"></div>
        </form>
    </div>

    <div id="root" style="display:none"></div>

    <!-- Encrypted trip data is loaded from payload.json before the password gate unlocks. -->

    <script>
        (function () {
            var PAYLOAD = null;
            var SYNC_META = null;

            function b64ToBytes(b64) {
                var bin = atob(b64), u = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
                return u;
            }

            async function decryptTrip(password) {
                var enc = new TextEncoder();
                var baseKey = await crypto.subtle.importKey(
                    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
                var key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
                    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
                var plainBuf = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: b64ToBytes(PAYLOAD.iv) }, key, b64ToBytes(PAYLOAD.data));
                return JSON.parse(new TextDecoder().decode(plainBuf));
            }

            function reveal(data) {
                function go() {
                    if (!window.mountTrip) { setTimeout(go, 30); return; }
                    window.mountTrip(data, SYNC_META);
                    document.getElementById('root').style.display = '';
                    var gate = document.getElementById('gate');
                    if (gate) gate.remove();
                }
                go();
            }

            var form = document.getElementById('gate-form');
            var pw = document.getElementById('gate-pw');
            var btn = document.getElementById('gate-btn');
            var err = document.getElementById('gate-err');

            var CACHE_KEY = null;

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                if (!PAYLOAD) return;
                err.textContent = '';
                btn.disabled = true;
                btn.textContent = '解锁中… Unlocking';
                try {
                    var data = await decryptTrip(pw.value);
                    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e2) {}
                    reveal(data);
                } catch (e3) {
                    err.textContent = '密码错误，请重试 · Incorrect password.';
                    btn.disabled = false;
                    btn.textContent = '解锁 Unlock';
                    pw.value = '';
                    pw.focus();
                }
            });

            async function initialize() {
                try {
                    var responses = await Promise.all([
                        fetch('./payload.json', { cache: 'no-store' }),
                        fetch('./sync.json', { cache: 'no-store' })
                    ]);
                    if (!responses[0].ok || !responses[1].ok) throw new Error('Trip data unavailable');
                    PAYLOAD = await responses[0].json();
                    SYNC_META = await responses[1].json();
                    CACHE_KEY = 'tripData:' + PAYLOAD.iv;

                    try {
                        for (var i = sessionStorage.length - 1; i >= 0; i--) {
                            var k = sessionStorage.key(i);
                            if (k && k.indexOf('tripData:') === 0 && k !== CACHE_KEY) sessionStorage.removeItem(k);
                        }
                        var cached = sessionStorage.getItem(CACHE_KEY);
                        if (cached) { reveal(JSON.parse(cached)); return; }
                    } catch (e) {}

                    btn.disabled = false;
                    btn.textContent = '解锁 Unlock';
                } catch (e) {
                    err.textContent = '行程数据暂时无法加载，请刷新重试 · Unable to load trip data.';
                    btn.textContent = '刷新 Refresh';
                    btn.disabled = false;
                    btn.type = 'button';
                    btn.addEventListener('click', function () { location.reload(); });
                }
            }

            initialize();
        })();
    </script>

    <script type="text/babel" data-presets="react">
        const { useState, useMemo } = React;

        const Icon = ({ type }) => {
            const icons = { flight: "✈️", lodging: "🏨", car: "🚗", transit: "🚌" };
            const colors = { flight: "bg-blue-100 text-blue-600", lodging: "bg-purple-100 text-purple-600", car: "bg-green-100 text-green-600", transit: "bg-orange-100 text-orange-600" };
            return <div className={`card-icon ${colors[type] || 'bg-gray-100'}`}>{icons[type]}</div>;
        };

        /* ---------- Alerts ---------- */
        const AlertBanner = ({ alerts, header, openWord }) => {
            // Collapsed by default — open it to read the detail.
            const [open, setOpen] = useState(false);
            if (!alerts || !alerts.length) return null;
            const style = {
                urgent: { box: "bg-red-50 border-red-200", dot: "bg-red-500", title: "text-red-900", body: "text-red-800" },
                warn:   { box: "bg-amber-50 border-amber-200", dot: "bg-amber-500", title: "text-amber-900", body: "text-amber-800" },
                info:   { box: "bg-sky-50 border-sky-200", dot: "bg-sky-500", title: "text-sky-900", body: "text-sky-800" },
                done:   { box: "bg-emerald-50 border-emerald-200", dot: "bg-emerald-500", title: "text-emerald-900", body: "text-emerald-700" }
            };
            const openCount = alerts.length;
            return (
                <div className="mb-6">
                    <button onClick={() => setOpen(!open)}
                            className="w-full flex items-center justify-between px-4 py-3 rounded-xl bg-white border border-gray-200 shadow-sm hover:shadow transition-shadow">
                        <span className="flex flex-wrap items-center gap-2 font-semibold text-gray-800 text-sm sm:text-base text-left">
                            <span className="inline-flex items-center justify-center w-6 h-6 rounded-full text-white text-xs font-bold bg-sky-500">
                                {openCount}
                            </span>
                            {header}
                            <span className="text-xs font-medium text-gray-500">({openCount} {openWord})</span>
                        </span>
                        <span className="text-gray-400 text-sm flex-shrink-0">{open ? '▲' : '▼'}</span>
                    </button>
                    {open && (
                        <div className="mt-3 space-y-3">
                            {alerts.map((a, i) => {
                                const s = style[a.level] || style.info;
                                const isDone = a.level === 'done';
                                return (
                                    <div key={i} className={`rounded-xl border p-4 ${s.box}`}>
                                        <div className="flex items-start gap-3">
                                            {isDone
                                                ? <span className="mt-0.5 text-emerald-600 font-bold flex-shrink-0">✓</span>
                                                : <span className={`mt-1.5 w-2 h-2 rounded-full flex-shrink-0 ${s.dot}`}></span>}
                                            <div className="min-w-0">
                                                <h4 className={`font-bold text-sm ${s.title} ${isDone ? 'opacity-80' : ''}`}>{a.title}</h4>
                                                <p className={`text-sm mt-1 leading-relaxed ${s.body}`}>{a.body}</p>
                                                {a.resolution && (
                                                    <p className="text-sm mt-2 leading-relaxed font-medium text-emerald-900 bg-white/70 border border-emerald-200 rounded-lg px-3 py-2">
                                                        {a.resolution}
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------- Flight segments ---------- */
        const Segments = ({ segments }) => (
            <div className="mt-3 space-y-2">
                {segments.map((s, i) => (
                    <div key={i} className="bg-slate-50 rounded-lg border border-slate-200 px-3 py-2">
                        <div className="flex flex-wrap items-baseline gap-x-2 gap-y-1">
                            <span className="text-xs font-bold text-slate-700 bg-white border border-slate-200 rounded px-1.5 py-0.5">{s.flight}</span>
                            <span className="text-sm text-slate-800">
                                <span className="font-semibold">{s.dep}</span> {s.from}
                            </span>
                            <span className="text-slate-400">→</span>
                            <span className="text-sm text-slate-800">
                                <span className="font-semibold">{s.arr}</span> {s.to}
                            </span>
                        </div>
                        {s.note && <p className="text-xs text-slate-500 mt-1">{s.note}</p>}
                    </div>
                ))}
            </div>
        );

        /* ---------- Logistics ---------- */
        const Logistics = ({ rows }) => (
            <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2">
                {rows.map((r, i) => (
                    <div key={i} className="text-sm">
                        <span className="text-gray-500">{r.label}: </span>
                        <span className="text-gray-900 font-medium">{r.value}</span>
                    </div>
                ))}
            </div>
        );

        /* ---------- One itinerary card ---------- */
        const ItemCard = ({ item }) => {
            const needsCheck = item.status === "待确认" || item.status === "Verify";
            return (
                <div className={`p-4 rounded-xl border bg-white shadow-sm transition-shadow hover:shadow-md ${needsCheck ? 'border-amber-300' : 'border-gray-200'}`}>
                    <div className="flex flex-col md:flex-row items-start gap-0 md:gap-4">
                        <div className="flex items-center gap-4 w-full md:w-auto mb-3 md:mb-0">
                            <Icon type={item.type} />
                            <div className="md:hidden flex items-center gap-3">
                                <span className="text-sm font-medium text-gray-500">{item.date}</span>
                                <span className={`text-xs px-2 py-1 rounded-full font-bold ${needsCheck ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}`}>{item.status}</span>
                            </div>
                        </div>

                        <div className="flex-1 w-full min-w-0">
                            <div className="hidden md:flex items-center gap-3 mb-1">
                                <span className="text-sm font-medium text-gray-500">{item.date}</span>
                                <span className={`text-xs px-2 py-1 rounded-full font-bold ${needsCheck ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}`}>{item.status}</span>
                            </div>

                            {/* Title + time on the same line */}
                            <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                                <h3 className="font-bold text-gray-900 text-lg leading-snug">{item.title}</h3>
                                {item.time && (
                                    <span className="text-base font-bold text-sky-700 tabular-nums whitespace-nowrap">
                                        {item.time}
                                    </span>
                                )}
                            </div>

                            <p className="text-gray-600 text-sm mt-1">{item.desc}</p>

                            {item.warn && (
                                <div className="mt-3 rounded-lg bg-amber-50 border border-amber-200 px-3 py-2">
                                    <p className="text-sm text-amber-900"><span className="font-bold">⚠️ </span>{item.warn}</p>
                                </div>
                            )}

                            {item.segments && <Segments segments={item.segments} />}
                            {item.logistics && <Logistics rows={item.logistics} />}

                            {(item.confirmation || item.check_in || item.check_out || item.address) && (
                                <div className="mt-3 flex flex-wrap gap-2">
                                    {item.confirmation && (
                                        <span className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-gray-100 text-gray-800 border border-gray-200">
                                            🎟️ {item.confirmation}
                                        </span>
                                    )}
                                    {item.check_in && (
                                        <span className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100">
                                            🕒 In: {item.check_in}
                                        </span>
                                    )}
                                    {item.check_out && (
                                        <span className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100">
                                            🕒 Out: {item.check_out}
                                        </span>
                                    )}
                                    {item.address && (
                                        <a href={`https://maps.google.com/?q=${encodeURIComponent(item.address)}`}
                                           target="_blank" rel="noopener noreferrer"
                                           className="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-purple-50 text-purple-700 border border-purple-100 hover:bg-purple-100 transition-colors">
                                            📍 {item.address}
                                        </a>
                                    )}
                                </div>
                            )}

                            {item.links && item.links.length > 0 && (
                                <div className="mt-3 flex flex-wrap gap-2">
                                    {item.links.map((l, i) => (
                                        <a key={i} href={l.url} target="_blank" rel="noopener noreferrer"
                                           className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-900 text-white hover:bg-gray-700 transition-colors">
                                            {l.label} ↗
                                        </a>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        /* ---------- Yellowstone page ---------- */
        const Yellowstone = ({ y }) => (
            <div className="space-y-6">
                <div>
                    <h2 className="text-2xl font-bold text-gray-900">{y.title}</h2>
                    <p className="text-gray-600 mt-1">{y.subtitle}</p>
                </div>

                {y.notice && (
                    <div className="rounded-xl border border-amber-200 bg-amber-50 p-4">
                        <h3 className="font-bold text-amber-900 text-sm">⚠️ {y.notice.title}</h3>
                        <ul className="mt-2 space-y-1.5">
                            {y.notice.items.map((it, i) => (
                                <li key={i} className="text-sm text-amber-800 flex gap-2">
                                    <span className="text-amber-500 flex-shrink-0">•</span><span>{it}</span>
                                </li>
                            ))}
                        </ul>
                    </div>
                )}

                {y.sections.map((sec, si) => (
                    <div key={si}>
                        <h3 className="text-lg font-bold text-gray-800 mb-3">{sec.heading}</h3>

                        {sec.type === 'days' && (
                            <div className="space-y-3">
                                {sec.days.map((d, i) => (
                                    <div key={i} className="rounded-xl border border-gray-200 bg-white shadow-sm p-4">
                                        <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1 mb-2">
                                            <span className="inline-flex items-center justify-center px-2.5 py-1 rounded-lg bg-sky-500 text-white text-xs font-bold">{d.day}</span>
                                            <span className="font-bold text-gray-900">{d.date}</span>
                                            <span className="text-gray-500 text-sm">{d.theme}</span>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                                            <div className="bg-slate-50 rounded-lg p-3 border border-slate-200">
                                                <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">AM</div>
                                                <p className="text-sm text-slate-800">{d.morning}</p>
                                            </div>
                                            <div className="bg-slate-50 rounded-lg p-3 border border-slate-200">
                                                <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">PM</div>
                                                <p className="text-sm text-slate-800">{d.afternoon}</p>
                                            </div>
                                        </div>
                                        {d.highlight && (
                                            <p className="text-sm text-gray-700 mt-3">
                                                <span className="font-semibold">👀 </span>{d.highlight}
                                            </p>
                                        )}
                                        {d.note && (
                                            <p className="text-xs text-amber-800 mt-2 bg-amber-50 border border-amber-200 rounded px-2 py-1.5">⚠️ {d.note}</p>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        {sec.type === 'table' && (
                            <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[520px]">
                                    <thead className="bg-gray-50">
                                        <tr>{sec.cols.map((c, i) => (
                                            <th key={i} className="p-3 border-b font-semibold text-gray-600 text-sm">{c}</th>
                                        ))}</tr>
                                    </thead>
                                    <tbody>
                                        {sec.rows.map((r, i) => (
                                            <tr key={i} className="border-b last:border-0 hover:bg-gray-50 transition-colors">
                                                {r.map((cell, j) => (
                                                    <td key={j} className={`p-3 text-sm ${j === 1 ? 'font-semibold text-gray-900' : 'text-gray-700'}`}>{cell}</td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {sec.type === 'list' && (
                            <div className="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
                                <ul className="space-y-2">
                                    {sec.items.map((it, i) => (
                                        <li key={i} className="text-sm text-gray-800 flex gap-2">
                                            <span className="text-sky-500 font-bold flex-shrink-0">{i + 1}.</span><span>{it}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}

                        {sec.note && <p className="text-sm text-gray-500 mt-2 italic">{sec.note}</p>}
                    </div>
                ))}
            </div>
        );

        /* ---------- Corrections page ---------- */
        const Changes = ({ c }) => (
            <div className="space-y-4">
                <p className="text-gray-700">{c.intro}</p>
                <div className="space-y-3">
                    {c.rows.map((r, i) => (
                        <div key={i} className="rounded-xl border border-gray-200 bg-white shadow-sm p-4">
                            <h4 className="font-bold text-gray-900 text-sm mb-3">{r.item}</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div className="rounded-lg bg-red-50 border border-red-200 p-3">
                                    <div className="text-xs font-bold text-red-500 uppercase tracking-wide mb-1">Was</div>
                                    <p className="text-sm text-red-900 line-through decoration-red-300">{r.was}</p>
                                </div>
                                <div className="rounded-lg bg-green-50 border border-green-200 p-3">
                                    <div className="text-xs font-bold text-green-600 uppercase tracking-wide mb-1">Now</div>
                                    <p className="text-sm text-green-900 font-medium">{r.now}</p>
                                </div>
                            </div>
                            <p className="text-xs text-gray-500 mt-3"><span className="font-semibold">Source: </span>{r.why}</p>
                        </div>
                    ))}
                </div>
            </div>
        );

        /* ---------- Main ---------- */
        const Dashboard = ({ tripData, syncMeta }) => {
            // Chinese by default so the page is readable to Bo's parents on open.
            const [lang, setLang] = useState('zh');
            const [tab, setTab] = useState('timeline');
            const t = tripData[lang];

            const totalUSD = useMemo(() => {
                return t.budget.reduce((acc, curr) => {
                    const numStr = curr.cost.replace(/[^\d.-]/g, '');
                    if (!numStr) return acc;
                    let val = parseFloat(numStr);
                    if (curr.cost.includes('CNY')) { val = val / 7.1; }
                    return acc + val;
                }, 0);
            }, [t.budget]);

            const formattedTotal = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(totalUSD);

            const TABS = [
                ['timeline', t.tabs.timeline],
                ['budget', t.tabs.budget],
                ['yellowstone', t.tabs.yellowstone],
                ['changes', t.tabs.changes]
            ];

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-2 border-b pb-4">
                        <h1 className="text-xl sm:text-2xl font-bold text-gray-800">{t.title}</h1>
                        <div className="bg-gray-200 p-1 rounded-lg flex text-sm font-medium self-start sm:self-auto">
                            <button onClick={() => setLang('zh')} className={`px-3 py-1 rounded-md transition-colors ${lang === 'zh' ? 'bg-white shadow' : 'text-gray-500 hover:text-gray-700'}`}>中文</button>
                            <button onClick={() => setLang('en')} className={`px-3 py-1 rounded-md transition-colors ${lang === 'en' ? 'bg-white shadow' : 'text-gray-500 hover:text-gray-700'}`}>English</button>
                        </div>
                    </div>
                    <div className="flex flex-wrap gap-x-3 gap-y-1 text-xs text-gray-400 mb-6">
                        <span>{t.verifiedLabel}</span>
                        {syncMeta?.lastSynced && (
                            <span title={syncMeta.source || ''}>
                                {lang === 'zh' ? '最近同步' : 'Last synced'}: {new Intl.DateTimeFormat(lang === 'zh' ? 'zh-CN' : 'en-US', {
                                    dateStyle: 'medium', timeStyle: 'short', timeZone: syncMeta.timeZone || 'America/Los_Angeles'
                                }).format(new Date(syncMeta.lastSynced))}
                            </span>
                        )}
                    </div>

                    <AlertBanner alerts={t.alerts} header={t.alertsHeader} openWord={t.urgentLabel} settledWord={t.settledWord} />

                    <div className="flex flex-wrap gap-2 mb-6">
                        {TABS.map(([key, label]) => (
                            <button key={key} onClick={() => setTab(key)}
                                    className={`px-4 py-2 rounded-lg font-semibold text-sm transition-colors ${tab === key ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                                {label}
                            </button>
                        ))}
                    </div>

                    {tab === 'timeline' && (
                        <div className="timeline-container mt-8 relative">
                            {t.phases.map((phase) => (
                                <div key={phase.id} className="mb-10 relative">
                                    <div className="timeline-dot">{phase.id}</div>
                                    <h2 className="text-lg sm:text-xl font-bold text-gray-800 mb-4">{phase.title}</h2>
                                    <div className="space-y-4">
                                        {phase.items.map((item, idx) => <ItemCard key={idx} item={item} />)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {tab === 'budget' && (
                        <div className="space-y-6">
                            <div className="bg-gradient-to-r from-gray-800 to-gray-700 rounded-xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center text-white">
                                <div>
                                    <h3 className="text-lg font-medium text-gray-200">{lang === 'zh' ? '预估总花费' : 'Estimated Total Cost'}</h3>
                                    <p className="text-sm text-gray-400 mt-1">{lang === 'zh' ? '* 含 CNY 换算（约 1 USD ≈ 7.1 CNY）' : '* Includes CNY conversion (approx. 1 USD ≈ 7.1 CNY)'}</p>
                                </div>
                                <div className="text-4xl font-bold mt-4 md:mt-0 tracking-tight text-white tabular-nums">
                                    {formattedTotal}
                                </div>
                            </div>

                            <div className="bg-white rounded-xl border shadow-sm overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[640px]">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="p-4 border-b font-semibold text-gray-600 text-sm">{lang === 'zh' ? '分类' : 'Category'}</th>
                                            <th className="p-4 border-b font-semibold text-gray-600 text-sm">{lang === 'zh' ? '项目' : 'Item'}</th>
                                            <th className="p-4 border-b font-semibold text-gray-600 text-sm text-right">{lang === 'zh' ? '金额' : 'Cost'}</th>
                                            <th className="p-4 border-b font-semibold text-gray-600 text-sm">{lang === 'zh' ? '政策与状态' : 'Policy & Status'}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {t.budget.map((b, idx) => (
                                            <tr key={idx} className="border-b last:border-0 hover:bg-gray-50 transition-colors">
                                                <td className="p-4 text-sm font-medium">{b.cat}</td>
                                                <td className="p-4 text-sm text-gray-700">{b.item}</td>
                                                <td className="p-4 text-sm font-bold text-gray-900 whitespace-nowrap text-right tabular-nums">{b.cost}</td>
                                                <td className="p-4 text-sm text-gray-600">{b.policy}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {tab === 'yellowstone' && <Yellowstone y={t.yellowstone} />}
                    {tab === 'changes' && <Changes c={t.changes} />}
                </div>
            );
        };

        window.mountTrip = (tripData, syncMeta) => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<Dashboard tripData={tripData} syncMeta={syncMeta} />);
        };
    </script>
</body>
</html>
